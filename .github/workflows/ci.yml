name: 跨平台檢查

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / Node.js ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: 設定 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: 依鎖定檔安裝套件
        run: npm ci
      - name: 檢查公開內容
        run: npm run check:public
      - name: 測試公開內容檢查器
        run: npm run test:public
      - name: 執行測試
        run: npm test
      - name: 型別檢查與建置
        run: npm run build
